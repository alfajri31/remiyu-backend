server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
spring:
  application:
    name: remiyu-backend
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    placeholders:
      seed_enabled: ${remiyu.seed.enabled}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
remiyu:
  ai:
    extract-path: ${AI_EXTRACT_PATH:/v1/extractions}
    summary-path: ${AI_SUMMARY_PATH:/v1/workspace-summaries}
    api-key: ${AI_API_KEY:}
    connect-timeout: 3s
    read-timeout: 15s
  auth:
    token-hours: ${AUTH_TOKEN_HOURS:24}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
  seed:
    enabled: false
