services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: remiyu
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d remiyu"]
      interval: 5s
      timeout: 3s
      retries: 10
  mockoon:
    image: mockoon/cli:9.9.0
    command: ["--data", "/data/remiyu-ai.json", "--port", "3002", "--hostname", "0.0.0.0"]
    volumes:
      - ./mockoon/remiyu-ai.json:/data/remiyu-ai.json:ro
    ports:
      - "127.0.0.1:3002:3002"
  backend:
    build: .
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://database:5432/remiyu
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: local
      AI_BASE_URL: http://mockoon:3002
      AI_PROVIDER: mockoon
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
      mockoon:
        condition: service_started
volumes:
  postgres_data:
